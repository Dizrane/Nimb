<!doctype html>
<!-- The page of Nimb in an ordinary browser, with a pretend Go side: for trying the interface quickly (no Windows needed).
     Serve the folder cmd/nimb (python3 -m http.server) and open /devtools/mock.html . -->
<html lang="ru"><head><meta charset="utf-8"><title>Nimb (mock)</title>
<base href="../frontend/dist/">
<link rel="stylesheet" href="style.css">
<style>html,body{max-width:940px;max-height:620px;margin:0 auto;border:1px solid #333}</style>
</head><body><div id="app"></div>
<script>
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const M = { ai: false, tg: false, media: false, provider: 'geohide-eu', busy: {}, err: {} };
const providers = [['geohide-eu', 'GeoHide (EU)'], ['comss', 'Comss.one'], ['geohide', 'GeoHide (RU)'], ['geohide-us', 'GeoHide (US)']];
const toggle = (k, name, ms) => async (on) => { M.busy[name] = true; await wait(ms); M[k] = on; delete M.busy[name]; return { ok: true }; };
window.go = { main: { App: {
  GetState: async () => ({
    version: '0.1.0', serviceOk: !location.search.includes('noservice'), serviceError: 'Служба Nimb не запущена. Переустановите Nimb или запустите службу «Nimb: помощник».',
    ai: { on: M.ai, provider: M.provider, busy: !!M.busy.ai }, telegram: { on: M.tg, busy: !!M.busy.telegram, port: 1443, link: 'tg://proxy?server=127.0.0.1&port=1443&secret=dd00', stats: { Total: 14, Active: 3, BytesUp: 1200000, BytesDown: 8400000 } },
    media: { on: M.media, busy: !!M.busy.media, handshakeAgo: 3 },
    providers: providers.map(([id, name]) => ({ id, name })),
  }),
  SetAI: toggle('ai', 'ai', 600), SetTelegram: toggle('tg', 'telegram', 300), SetMedia: toggle('media', 'media', 1500),
  SetAll: async (on) => { await Promise.all([toggle('ai', 'ai', 600)(on), toggle('tg', 'telegram', 300)(on), toggle('media', 'media', 1500)(on)]); return { ok: true }; },
  SetProvider: async (id) => { M.provider = id; return { ok: true }; },
  Onboarded: async () => localStorage.getItem('onb') === '1', FinishOnboarding: async () => localStorage.setItem('onb', '1'),
  RestartOnboarding: async () => localStorage.removeItem('onb'), OpenTerms: () => {},
  GetAutostart: async () => localStorage.getItem('auto') === '1', SetAutostart: async (on) => { localStorage.setItem('auto', on ? '1' : '0'); return { ok: true }; },
  ReportPrepare: async () => { await wait(600); return { id: 'AB12CD', facts: '— Программа —\nNimb для Windows 0.1.0\n\n— Сервисы —\nНейросети: выключено' }; },
  ReportPreview: async (d, c) => `Отчёт № AB12CD\n\nЧто случилось:\n${d || '(не описано)'}${c ? '\n\nКак ответить: ' + c : ''}\n\n— Программа —\nNimb для Windows 0.1.0`,
  ReportSend: async () => { await wait(800); return location.search.includes('fail') ? { ok: false, error: 'Не удалось соединиться с сервером отчётов.' } : { ok: true }; },
  ReportCopy: async () => ({ ok: true }), ReportWrite: async () => ({ ok: true }),
  OpenTelegram: async () => ({ ok: true }), CopyLink: async () => ({ ok: true }), OpenChannel: () => {}, Quit: () => {}, Log: () => {},
  InitialPage: async () => new URLSearchParams(location.search).get('page') || 'home',
} } };
</script>
<script src="app.js"></script>
</body></html>
